# Perfil "prod": hospedagem online (ex.: Render + Neon). Ative com SPRING_PROFILES_ACTIVE=prod.
# O que nao estiver aqui vem do application.properties (padrao local, MySQL).
#
# Variaveis de ambiente esperadas:
#   DB_URL        jdbc:postgresql://<host>/<banco>?sslmode=require   (URL JDBC do Neon)
#   DB_USER       usuario do banco
#   DB_PASSWORD   senha do banco
# Opcionais:
#   PORT          porta HTTP (o Render define sozinho; padrao 8080)
#   REDIS_ENABLED / REDIS_HOST / REDIS_PORT / REDIS_PASSWORD   (padrao: Redis desligado)

server.port=${PORT:8080}
# Atras do proxy do Render: respeita X-Forwarded-Proto/For (https, IP real do aluno)
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Plano gratuito tem poucas conexoes; e o banco suspende quando ocioso.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis hoje so recebe gravacoes; em hospedagem simples fica desligado.
argus.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Disco de hospedagem e efemero: o historico fica no banco, nao em arquivos.
argus.event-log-files=false
