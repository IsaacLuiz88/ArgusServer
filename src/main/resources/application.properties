# SERVER
server.address=0.0.0.0
server.port=8080
spring.application.name=ArgusServer

# DATASOURCE (MYSQL)
spring.datasource.url=jdbc:mysql://localhost:3307/argus_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# REDIS (localhost:6379). Prefixo do Spring Boot 3: spring.data.redis.*
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
# false = nao usa Redis (o servidor funciona sem ele; hoje so recebe gravacoes)
argus.redis.enabled=true

# Log por evento em logs/<prova>/<aluno>.log (o historico completo ja fica no banco)
argus.event-log-files=true

# TIMEZONE GLOBAL (SPRING / JACKSON)
spring.jackson.time-zone=America/Recife

# TIMEZONE DO HIBERNATE (JPA)
spring.jpa.properties.hibernate.jdbc.time_zone=America/Recife
